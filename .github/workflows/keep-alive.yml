name: Keep Train Delay Prediction Service Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Train Delay Prediction service
        run: curl -fsS https://train-delay-prediction-system.onrender.com/api/health
